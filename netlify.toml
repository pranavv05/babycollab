[build]
  command = "next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Increase timeout for API functions
  node_bundler = "esbuild"
  
[functions."api/roadmaps"]
  # Increase timeout for roadmap API functions
  timeout = 30
  
[functions."api/generate-roadmap"]
  # Increase timeout for AI generation
  timeout = 60

[functions."api/suggest-roadmaps"]
  # Increase timeout for AI suggestion generation
  timeout = 60

# Redirects for API routes
[[redirects]]
  from = "/api/roadmaps*"
  to = "/.netlify/functions/next_api_roadmaps"
  status = 200

[[redirects]]
  from = "/api/generate-roadmap"
  to = "/.netlify/functions/next_api_generate-roadmap"
  status = 200

[[redirects]]
  from = "/api/suggest-roadmaps"
  to = "/.netlify/functions/next_api_suggest-roadmaps"
  status = 200

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200